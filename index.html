<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quant Blog Aggregator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    background: #f4f4f1;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #16150f;
    margin: 0;
    padding: 0;
  }
  .header {
    background: #ff6600;
    padding: 14px 24px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.01em;
    color: #fff;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 24px 96px;
  }
  #status {
    padding: 4px 0 18px;
    color: #52514e;
    font-size: 13px;
  }
  .batch {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(10, auto);
    column-gap: 32px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 0;
    border-bottom: 1px solid #e1e0d9;
    min-width: 0;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .time {
    font-size: 11px;
    color: #898781;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    color: #16150f;
    text-decoration: none;
    overflow-wrap: break-word;
  }
  .card-title:visited { color: #52514e; }
  .card-title:hover { text-decoration: underline; }
  #sentinel { height: 1px; }
</style>
</head>
<body>

<div class="header">Quant Blog Aggregator</div>
<div class="container">
  <div id="status">Loading feed.json…</div>
  <div id="list"></div>
  <div id="sentinel"></div>
</div>

<script>
// Categorical palette — 8 hues, fixed order, each validated for CVD-safe
// adjacent contrast, with a text color picked per-hue for legibility
// (computed against WCAG contrast, not eyeballed).
const PALETTE = [
  { bg: "#2a78d6", text: "#0b0b0b" }, // blue
  { bg: "#eb6834", text: "#0b0b0b" }, // orange
  { bg: "#1baf7a", text: "#0b0b0b" }, // aqua
  { bg: "#eda100", text: "#0b0b0b" }, // yellow
  { bg: "#e87ba4", text: "#0b0b0b" }, // magenta
  { bg: "#008300", text: "#ffffff" }, // green
  { bg: "#4a3aa7", text: "#ffffff" }, // violet
  { bg: "#e34948", text: "#0b0b0b" }, // red
];

function hashString(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function colorForSource(source) {
  if (/aqr/i.test(source)) return PALETTE[5]; // green, as requested
  return PALETTE[hashString(source) % PALETTE.length];
}

function relativeTime(isoString) {
  const then = new Date(isoString).getTime();
  const now = Date.now();
  const diffSec = Math.floor((now - then) / 1000);
  if (diffSec < 3600) return Math.max(1, Math.floor(diffSec / 60)) + "m ago";
  if (diffSec < 86400) return Math.floor(diffSec / 3600) + "h ago";
  return Math.floor(diffSec / 86400) + "d ago";
}

function computeColumns() {
  const w = window.innerWidth;
  if (w >= 1400) return 4;
  if (w >= 1000) return 3;
  if (w >= 650) return 2;
  return 1;
}

function buildCard(item) {
  const card = document.createElement("article");
  card.className = "card";

  const top = document.createElement("div");
  top.className = "card-top";

  const badge = document.createElement("span");
  badge.className = "badge";
  const c = colorForSource(item.source || "");
  badge.style.background = c.bg;
  badge.style.color = c.text;
  badge.textContent = item.source;
  top.appendChild(badge);

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = relativeTime(item.published);
  top.appendChild(time);

  const title = document.createElement("a");
  title.className = "card-title";
  title.textContent = item.title;
  title.target = "_blank";
  title.rel = "noopener";
  if (/^https?:\/\//i.test(item.link || "")) {
    title.href = item.link;
  }

  card.appendChild(top);
  card.appendChild(title);
  return card;
}

let allItems = [];
let loadedCount = 0;
let numColumns = 4;

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const sentinelEl = document.getElementById("sentinel");

function renderNextBatch() {
  const batchSize = numColumns * 10;
  const slice = allItems.slice(loadedCount, loadedCount + batchSize);
  if (slice.length === 0) return;

  const batchEl = document.createElement("div");
  batchEl.className = "batch";
  batchEl.style.gridTemplateColumns = `repeat(${numColumns}, 1fr)`;
  slice.forEach((item) => batchEl.appendChild(buildCard(item)));
  listEl.appendChild(batchEl);

  loadedCount += slice.length;
}

const observer = new IntersectionObserver(
  (entries) => {
    if (!entries[0].isIntersecting) return;
    renderNextBatch();
    if (loadedCount >= allItems.length) observer.disconnect();
  },
  { rootMargin: "600px" }
);

async function loadFeed() {
  try {
    const res = await fetch("./feed.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    allItems = data.items || [];
    numColumns = computeColumns();

    statusEl.textContent = allItems.length
      ? `${allItems.length} items — updated ${relativeTime(data.generated_at)}`
      : "No items found.";

    renderNextBatch();
    if (loadedCount < allItems.length) {
      observer.observe(sentinelEl);
    }
  } catch (err) {
    statusEl.textContent = "Failed to load feed.json: " + err.message;
  }
}

loadFeed();
</script>

</body>
</html>
